<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pile Settings</title>
    <style>
        :root {
            --bg: #f9f9fa;
            --color: #15141a;
            --color-description: #5b5b66;
            --select-width: 180px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #23222b;
                --color: #fafafe;
                --color-description: #b1b1b3;
            }
        }

        body {
            margin: 0;
            background-color: var(--bg);
            color: var(--color);
            font-family: system-ui, sans-serif;
            font-size: 13px;
            padding: 32px 16px 16px 16px;
            box-sizing: border-box;
        }

        /* The options form is a simple two-column table: labels in the first
           column, fields in the second. Checkboxes sit left of their label
           text inside the label itself. The label column sizes itself to the
           widest label, so the fields always line up. */
        .settings {
            display: table;
        }

        .setting {
            display: table-row;
        }

        .setting > * {
            display: table-cell;
            vertical-align: middle;
            padding: 0 12px 32px 0;
        }

        /* Flush left like the other labels, small gap to the label text.
           vertical-align: middle gets the checkbox close to the text's center;
           the 1px relative nudge is optical correction for how Firefox paints
           the control — adjust it, not vertical-align, if it still looks off. */
        input[type="checkbox"] {
            margin: 0 6px 0 0;
            vertical-align: middle;
            position: relative;
            top: -1px;
        }

        select {
            width: var(--select-width);
        }

        input[type="text"] {
            width: 130px;
            font-size: 13px;
            font-family: system-ui, sans-serif;
        }

        input[type="number"] {
            width: 56px;
            font-size: 13px;
            font-family: system-ui, sans-serif;
        }

        button {
            font-size: 13px;
            font-family: system-ui, sans-serif;
            cursor: pointer;
        }

        .description {
            color: var(--color-description);
        }

        /* Breathing room between the session gap number field and its unit text. */
        #input-session-gap + .description {
            margin-left: 4px;
        }

        .description.error {
            color: #d7264b;
        }
    </style>
</head>
<body>
    <div class="settings">
        <div class="setting">
            <label for="select-theme" data-localize-text="optionTheme">Theme</label>
            <span>
                <select name="themes" id="select-theme">
                    <option value="theme-light" data-localize-text="optionThemeLight">light</option>
                    <option value="theme-dark" data-localize-text="optionThemeDark">dark</option>
                </select>
            </span>
        </div>
        <div class="setting">
            <label for="input-folder-name" data-localize-text="optionFolderName">Folder name</label>
            <span>
                <input type="text" id="input-folder-name" placeholder="Pile" maxlength="64">
                <button id="btn-save-folder-name" data-localize-text="optionRename">Rename</button>
                <span class="description" id="folder-name-error"></span>
            </span>
        </div>
        <div class="setting">
            <!-- The label text sits in its own span: the localizer replaces textContent,
                 which would wipe out the nested checkbox if it targeted the label itself. -->
            <label><input type="checkbox" id="checkbox-session-enabled"><span data-localize-text="optionShowSessions">Show sessions</span></label>
            <span>
                <input type="number" id="input-session-gap" min="1" max="168" step="1">
                <span class="description" data-localize-text="optionSessionGap">hours apart starts a new session</span>
            </span>
        </div>
        <div class="setting">
            <label><input type="checkbox" id="checkbox-open-in-active-tab"><span data-localize-text="optionOpenInActiveTab">Open in active tab</span></label>
        </div>
    </div>
    <script src="options.js" defer></script>
</body>
</html>
